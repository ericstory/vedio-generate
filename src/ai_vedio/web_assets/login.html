<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="__BASE_PATH__/">
  <title>登录 · WhichDrama Studio</title>
  <link rel="stylesheet" href="./static/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-visual" aria-label="WhichDrama Studio">
      <a class="brand brand-light" href="https://whichdrama.com" aria-label="WhichDrama 首页">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>WhichDrama <b>Studio</b></span>
      </a>
      <div class="login-copy">
        <p class="eyebrow">AI VIDEO WORKSPACE</p>
        <h1>让每一个想法<br>开始流动。</h1>
        <p>从一句描述到一段影像，为创意团队打造的智能视频工作台。</p>
      </div>
      <div class="film-strip"><span></span><span></span><span></span><span></span></div>
    </section>
    <section class="login-panel">
      <form id="login-form" class="login-form" action="./api/login-form" method="post">
        <div class="mobile-brand">WhichDrama <b>Studio</b></div>
        <p class="eyebrow dark">管理后台</p>
        <h2>欢迎回来</h2>
        <p class="muted">登录后进入 AI 视频生成工作台</p>
        <label>管理员账号<input name="username" autocomplete="username" placeholder="请输入账号" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary-button" type="submit">进入工作台 <span>↗</span></button>
        <p class="secure-note"><span>◇</span> 仅限授权团队成员访问</p>
      </form>
    </section>
  </main>
  <script src="./static/login.js" defer></script>
</body>
</html>
