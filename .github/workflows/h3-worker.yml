name: Build MiniMax H3 GPU worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/minimax-h3/**"
      - ".github/workflows/h3-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The SGLang CUDA 13 base is ~14 GB and the SageAttention SM12.0 build
      # needs room for its object files, so reclaim the runner's preinstalled
      # toolchains before the build starts.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/minimax-h3
          file: workers/minimax-h3/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papa-minimax-h3:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
