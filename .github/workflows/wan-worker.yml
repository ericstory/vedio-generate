name: Build Wan V2 GPU worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/wan-video/**"
      - ".github/workflows/wan-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/wan-video
          file: workers/wan-video/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papa-wan-video:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
